spring.application.name=mes-test
server.port=8081

# H2 In-Memory Database for Unit & Integration Tests
spring.datasource.url=jdbc:h2:mem:mes_test_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Flyway during fast Mockito/H2 unit tests
spring.flyway.enabled=false

