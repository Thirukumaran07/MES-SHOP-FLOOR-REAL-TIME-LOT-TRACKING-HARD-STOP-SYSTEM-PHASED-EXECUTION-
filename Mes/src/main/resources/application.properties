spring.application.name=Mes
server.port=8080

# PostgreSQL Datasource Configuration (with sensible environment overrides for Docker)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mes_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:mes_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mes_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# Flyway Migration Settings
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Jackson Date/Time Serialization
spring.jackson.serialization.write-dates-as-timestamps=false
