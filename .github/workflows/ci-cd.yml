name: AeroMed MES CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ============================================================================
  # 1. Backend CI: Compile, Validate Schema, and Run Unit Tests
  # ============================================================================
  backend-ci:
    name: Backend Test Suite (Spring Boot & JUnit 5)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x Mes/mvnw

      - name: Run Backend Unit Tests (Hard-Stop Engine & Yield Analytics)
        run: |
          cd Mes
          ./mvnw clean test -B

      - name: Upload Test Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: Mes/target/surefire-reports/

  # ============================================================================
  # 2. Frontend CI: Lint, Typecheck, and Static Asset Bundle Build
  # ============================================================================
  frontend-ci:
    name: Frontend Production Build (React & Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Compile Production Bundle
        run: |
          cd frontend
          npm run build

      - name: Upload Production Dist Bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-bundle
          path: frontend/dist/

  # ============================================================================
  # 3. Docker Compose Configuration Integrity Validation
  # ============================================================================
  docker-validation:
    name: Container Build & Compose Integrity Check
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration Syntax
        run: docker compose config
